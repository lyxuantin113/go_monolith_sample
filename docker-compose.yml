version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: go_monolith_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: go_monolith_redis
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
